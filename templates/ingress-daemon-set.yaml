  namespace: ingress-nginx-{{ juju_application }}
  labels:
    app.kubernetes.io/name: ingress-nginx-{{ juju_application }}
    app.kubernetes.io/part-of: ingress-nginx-{{ juju_application }}
    cdk-{{ juju_application }}-ingress: "true"
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
      - pods
      - secrets
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
